[project]
name = "estresse-trabalho-jss"
version = "0.1.0"
description = "Estresse no trabalho por setor, com a Job Stress Scale (dados sintéticos)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
